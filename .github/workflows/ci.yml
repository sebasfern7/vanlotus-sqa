name: CI - VanLotus SQA

# Se ejecuta en cada push y en cada pull request
on: [push, pull_request]

jobs:
  backend:
    name: Backend (TDD + Cucumber)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4          # descarga el código del repo
      - uses: actions/setup-java@v4        # instala Java 17
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas unitarias y de aceptación
        run: ./mvnw -B test

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4        # instala Node 22
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci                        # instala las versiones exactas del package-lock
      - run: npm test                      # corre las pruebas de Vitest
